# 每行一条规则:  来源(访客用的 Host)   目标跳转地址
# 以 # 开头的行和空行忽略。
#
# 来源支持三种写法:
#   www.foo.com        精确域名
#   *.foo.com          通配符, 匹配 a.foo.com / b.foo.com, 但不匹配 foo.com 本身
#   203.0.2.5          裸 IP(访客直接用 IP 访问时 Host 头就是这个 IP)
#
# 目标必须是完整的 http(s)://主机[:端口][/路径], 访客原始的路径和 ?查询串
# 会自动拼到目标后面(见 $request_uri), 所以目标里不用写。
# 结尾多余的 / 会被自动去掉。
#
# 交付方式由目标落在哪台机器决定, 不用在这里写: 目标解析到的 IP 就是本机(含同 IP 换端口)
# 时走 nginx 内部转发, 访客地址栏保持来源域名、该端口也不必对外放行; 目标在别的机器时返回 302,
# 由访客的浏览器去连目标。判定结果看 `python3 render.py --print-modes`, 详见 README。
#
# 改完执行 ./deploy.sh 生效。
# 访客用 http 还是 https 访问都按同一套规则走(443 默认是现签的自签证书,
# 浏览器会告警; 要换受信证书跑 ./ssl.sh le <精确域名>, 详见 README)。

# --- 精确域名 ---
cio.dhis2.cn      http://www.dhis2.cn:1578
THEA.fhir.press   http://THEA.fhir.press:5268

# --- 通配符子域名, 接到目标的 /dashboard 前缀下 ---
*.example-b.com        http://127.0.0.1:9000/dashboard

# --- 按 IP 访问 ---
203.0.2.5              http://127.0.0.1:3000
