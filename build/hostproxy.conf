# 由 render.py 从 routes.conf 自动生成, 不要手工编辑。版本 3987d1a4a5c7
# hostproxy-port: 80
# hostproxy-https-port: 443
# hostproxy-certs-dir: /etc/nginx/certs/hostproxy
log_format hostproxy '$time_iso8601 host="$host" port=$server_port req="$request" -> $status';

# WebSocket 升级: 非升级请求要发 Connection: close
map $http_upgrade $hostproxy_upgrade {
    default upgrade;
    ''      close;
}

# 没匹配到任何来源时的兜底: 400
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate /etc/nginx/certs/hostproxy/_default/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/hostproxy/_default/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:HOSTPROXY:10m;
    ssl_session_timeout 1d;
    server_name _;
    access_log /var/log/nginx/hostproxy.access.log hostproxy;
    add_header X-Rules-Version "3987d1a4a5c7" always;
    default_type text/plain;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 400 'bad request: Host "$host" is not configured in routes.conf\n';
    }
}

# cio.dhis2.cn  ->  http://www.dhis2.cn:1578  [跳转]
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/nginx/certs/hostproxy/cio.dhis2.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/hostproxy/cio.dhis2.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:HOSTPROXY:10m;
    ssl_session_timeout 1d;
    server_name cio.dhis2.cn;
    access_log /var/log/nginx/hostproxy.access.log hostproxy;
    add_header X-Rules-Version "3987d1a4a5c7" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 302 "http://www.dhis2.cn:1578$request_uri";
    }
}

# THEA.fhir.press  ->  http://THEA.fhir.press:5268  [转发 http://127.0.0.1:5268]
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/nginx/certs/hostproxy/THEA.fhir.press/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/hostproxy/THEA.fhir.press/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:HOSTPROXY:10m;
    ssl_session_timeout 1d;
    server_name THEA.fhir.press;
    access_log /var/log/nginx/hostproxy.access.log hostproxy;
    add_header X-Rules-Version "3987d1a4a5c7" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:5268;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hostproxy_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_redirect http://127.0.0.1:5268/ /;
        proxy_redirect http://thea.fhir.press:5268/ /;
    }
}

